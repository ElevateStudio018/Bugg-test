name: Deploy preview to GitHub Pages

on:
  push:
    branches: [claude/markmontage-hemsida]
  workflow_dispatch:
  # Picks up what the admin publishes when Supabase cannot start the build itself (no GITHUB_DISPATCH_TOKEN).
  # GitHub runs schedules from the repository's default branch only.
  schedule:
    - cron: "*/10 * * * *"

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  # On the schedule: build only when the admin has published a version the live site does not have yet. Pushes and
  # runs started by hand always build.
  check:
    runs-on: ubuntu-latest
    outputs:
      build: ${{ steps.compare.outputs.build }}
    steps:
      - id: compare
        env:
          SUPABASE_URL: ${{ vars.NEXT_PUBLIC_SUPABASE_URL }}
          SUPABASE_KEY: ${{ vars.NEXT_PUBLIC_SUPABASE_ANON_KEY }}
          LIVE_VERSION_URL: https://elevatestudio018.github.io/Bugg-test/site-version.json
        run: |
          if [ "${{ github.event_name }}" != "schedule" ]; then echo "build=true" >> "$GITHUB_OUTPUT"; exit 0; fi
          published=$(curl -sf "$SUPABASE_URL/rest/v1/site_snapshot?select=version&id=eq.1" -H "apikey: $SUPABASE_KEY" | jq -r '.[0].version // empty')
          live=$(curl -sf "$LIVE_VERSION_URL" | jq -r '.version // empty' || true)
          echo "published=$published live=$live"
          if [ -n "$published" ] && [ "$published" != "$live" ]; then echo "build=true" >> "$GITHUB_OUTPUT"; else echo "build=false" >> "$GITHUB_OUTPUT"; fi

  build:
    needs: check
    if: needs.check.outputs.build == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - run: npm run build
        env:
          GITHUB_PAGES: "true"
          # The site's Supabase project (public values, row level security protects the data). Set them as repository
          # variables (Settings → Secrets and variables → Actions → Variables); while they are unset the site is built
          # from content/baseline.json and the admin shows itself as not yet connected.
          NEXT_PUBLIC_SUPABASE_URL: ${{ vars.NEXT_PUBLIC_SUPABASE_URL }}
          NEXT_PUBLIC_SUPABASE_ANON_KEY: ${{ vars.NEXT_PUBLIC_SUPABASE_ANON_KEY }}
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: ./out

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
