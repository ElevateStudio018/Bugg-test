name: Githack preview

# Builds the site for raw.githack.com and puts the built files on a branch of their own, so the preview is at
# https://raw.githack.com/ElevateStudio018/Bugg-test/githack/index.html on every push, or by hand
# (Actions → Githack preview → Run workflow). The additions branch gets its own preview on "githack-tillagg":
# https://raw.githack.com/ElevateStudio018/Bugg-test/githack-tillagg/index.html
on:
  push:
    branches: [claude/markmontage-hemsida, claude/markmontage-tillagg]
  workflow_dispatch:
  # Picks up what the admin publishes (see deploy-pages.yml).
  schedule:
    - cron: "*/10 * * * *"

permissions:
  contents: write

concurrency:
  group: githack-${{ github.ref_name }}
  cancel-in-progress: false

jobs:
  # On the schedule: build only when the admin has published a version the live site does not have yet. Pushes and
  # runs started by hand always build.
  check:
    runs-on: ubuntu-latest
    outputs:
      build: ${{ steps.compare.outputs.build }}
    steps:
      - id: compare
        env:
          SUPABASE_URL: ${{ vars.NEXT_PUBLIC_SUPABASE_URL }}
          SUPABASE_KEY: ${{ vars.NEXT_PUBLIC_SUPABASE_ANON_KEY }}
          LIVE_VERSION_URL: https://raw.githubusercontent.com/ElevateStudio018/Bugg-test/githack/site-version.json
        run: |
          if [ "${{ github.event_name }}" != "schedule" ]; then echo "build=true" >> "$GITHUB_OUTPUT"; exit 0; fi
          published=$(curl -sf "$SUPABASE_URL/rest/v1/site_snapshot?select=version&id=eq.1" -H "apikey: $SUPABASE_KEY" | jq -r '.[0].version // empty')
          live=$(curl -sf "$LIVE_VERSION_URL" | jq -r '.version // empty' || true)
          echo "published=$published live=$live"
          if [ -n "$published" ] && [ "$published" != "$live" ]; then echo "build=true" >> "$GITHUB_OUTPUT"; else echo "build=false" >> "$GITHUB_OUTPUT"; fi

  build:
    needs: check
    if: needs.check.outputs.build == 'true'
    runs-on: ubuntu-latest
    env:
      OUT_BRANCH: ${{ github.ref_name == 'claude/markmontage-tillagg' && 'githack-tillagg' || 'githack' }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - run: npm run build
        env:
          # Githack serves the branch's files under /<owner>/<repo>/<branch>/.
          STATIC_BASE_PATH: /ElevateStudio018/Bugg-test/${{ env.OUT_BRANCH }}
          NEXT_PUBLIC_SUPABASE_URL: ${{ vars.NEXT_PUBLIC_SUPABASE_URL }}
          NEXT_PUBLIC_SUPABASE_ANON_KEY: ${{ vars.NEXT_PUBLIC_SUPABASE_ANON_KEY }}
      # A new commit on top of the branch with the built files only; the branch is created the first time.
      - run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898283+github-actions[bot]@users.noreply.github.com"
          if git ls-remote --exit-code --heads origin "$OUT_BRANCH" >/dev/null; then
            git fetch --depth 1 origin "$OUT_BRANCH"
            git worktree add --detach ../githack FETCH_HEAD
          else
            git worktree add --detach ../githack
            (cd ../githack && git checkout -q --orphan "$OUT_BRANCH-new")
          fi
          cd ../githack
          git rm -rfq --ignore-unmatch .
          cp -r "$GITHUB_WORKSPACE/out/." .
          git add -A
          git commit -qm "Githack preview of $GITHUB_SHA" || exit 0
          git push origin "HEAD:refs/heads/$OUT_BRANCH"
